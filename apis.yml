aid: axionorbital-space
name: Axionorbital Space
description: >-
  AxionOrbital Space is a San Francisco Bay Area startup (Y Combinator Winter
  2026) building foundation models for continuous Earth observation through
  clouds and darkness. Its flagship model, ORION, converts Synthetic Aperture
  Radar (SAR) data into high-resolution, photorealistic optical imagery in real
  time using deterministic one-step diffusion, overcoming the limitation that
  traditional optical satellites are unusable roughly 70% of the time due to
  weather and night cycles. The technology targets 24/7 situational awareness
  for defense and intelligence, commodities and financial analytics, disaster
  response, agriculture, and climate monitoring. Founded in 2025 by Dhenenjay
  Yadav (CEO, former ISRO ML engineer) and Atharva Peshkar (CTO, PhD, CU
  Boulder / Harvard VCG). At the time of profiling the company is pre-product
  with no public API, developer portal, or specifications published; this
  record captures its identity for the API Evangelist network.
